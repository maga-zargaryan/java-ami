name: InstallJava
description: Install Java runtime on Amazon Linux 2023
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: InstallJava
        action: ExecuteBash
        inputs:
          commands:
            - dnf install -y java-21-amazon-corretto-headless
            - java -version

      - name: ConfigureTimezone
        action: ExecuteBash
        inputs:
          commands:
            - timedatectl set-timezone UTC