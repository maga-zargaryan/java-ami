name: Build image

# Starts an Image Builder pipeline execution and waits for the result, so a
# failed build or failed image test fails the workflow.
on:
  workflow_call:
    inputs:
      pipeline_arn:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      pipeline_arn:
        description: Image pipeline ARN (defaults to the java-app pipeline)
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: shared
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start pipeline execution
        id: start
        env:
          PIPELINE_ARN: ${{ inputs.pipeline_arn }}
        run: |
          if [[ -z "$PIPELINE_ARN" ]]; then
            PIPELINE_ARN=$(aws imagebuilder list-image-pipelines \
              --filters name=name,values=java-app \
              --query 'imagePipelineList[0].arn' --output text)
          fi
          IMAGE_ARN=$(aws imagebuilder start-image-pipeline-execution \
            --image-pipeline-arn "$PIPELINE_ARN" \
            --query imageBuildVersionArn --output text)
          echo "image_arn=$IMAGE_ARN" >> "$GITHUB_OUTPUT"
          echo "Started $IMAGE_ARN"

      - name: Wait for build and tests
        env:
          IMAGE_ARN: ${{ steps.start.outputs.image_arn }}
        run: |
          while true; do
            STATUS=$(aws imagebuilder get-image --image-build-version-arn "$IMAGE_ARN" \
              --query 'image.state.status' --output text)
            echo "$(date -u +%H:%M:%S) $STATUS"
            case "$STATUS" in
              AVAILABLE) break ;;
              FAILED|CANCELLED|DEPRECATED|DELETED)
                aws imagebuilder get-image --image-build-version-arn "$IMAGE_ARN" \
                  --query 'image.state.reason' --output text
                exit 1 ;;
            esac
            sleep 60
          done
          AMI_ID=$(aws imagebuilder get-image --image-build-version-arn "$IMAGE_ARN" \
            --query 'image.outputResources.amis[0].image' --output text)
          {
            echo "### Image available"
            echo "- Image: \`$IMAGE_ARN\`"
            echo "- AMI: \`$AMI_ID\`"
            echo "- A pull request pinning dev to it is opened in java-infra"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Token for java-infra
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: java-infra

      # Dev is pinned to the new AMI by pull request; prod is promoted later from java-infra.
      - name: Open the dev pull request in java-infra
        if: vars.RELEASE_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_ARN: ${{ steps.start.outputs.image_arn }}
        run: |
          AMI_ID=$(aws imagebuilder get-image --image-build-version-arn "$IMAGE_ARN" \
            --query 'image.outputResources.amis[0].image' --output text)
          APP_VERSION=$(aws ec2 describe-images --image-ids "$AMI_ID" \
            --query "Images[0].Tags[?Key=='AppVersion'].Value | [0]" --output text)
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/java-infra.git" java-infra
          cd java-infra
          BRANCH="deploy/dev-$AMI_ID"
          git switch -c "$BRANCH"
          sed -i -E "s/^(ami_id *= *)\"[^\"]*\"/\1\"$AMI_ID\"/" terraform/environments/dev/terraform.tfvars
          if git diff --quiet; then
            echo "::notice::java-infra dev does not pin ami_id yet (or already runs $AMI_ID); set it once by hand"
            exit 0
          fi
          git -c user.name="java-platform-release[bot]" -c user.email="java-platform-release[bot]@users.noreply.github.com" \
            commit -qam "Deploy app AMI $AMI_ID (java-app $APP_VERSION) to dev"
          git push --quiet origin "$BRANCH"
          gh pr create --repo "${GITHUB_REPOSITORY_OWNER}/java-infra" --head "$BRANCH" \
            --title "Deploy java-app $APP_VERSION ($AMI_ID) to dev" \
            --body "New app AMI \`$AMI_ID\` built and tested by ${GITHUB_REPOSITORY} ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Merging rolls dev to it. Promote to prod afterwards with the **Promote** workflow."
